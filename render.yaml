services:
  - type: web
    name: career-intelligence-platform
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: career-intelligence-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: career-intelligence-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: career-intelligence-db
          property: password
      - key: CAREER_EVENTS_ENABLED
        value: "false"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75.0"

databases:
  - name: career-intelligence-db
    plan: free
    databaseName: career
    user: career
