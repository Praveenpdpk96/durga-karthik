spring:
  application:
    name: career-intelligence-platform
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:careerdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
