server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: career-intelligence-platform
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:career}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

career:
  events:
    enabled: ${CAREER_EVENTS_ENABLED:false}
    application-topic: ${APPLICATION_EVENTS_TOPIC:career.application-events}
  ai:
    enabled: ${CAREER_AI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    endpoint: ${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
